name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: nursesbar-shiftwise/package-lock.json

      - name: Install ShiftWise dependencies
        working-directory: nursesbar-shiftwise
        run: npm ci

      - name: Build ShiftWise app
        working-directory: nursesbar-shiftwise
        run: npm run build
        env:
          VITE_BASE_PATH: /azfrannymobilenotary/shiftwise/

      - name: Assemble Pages artifact
        run: |
          mkdir -p _site/shiftwise
          # Copy existing root HTML files (notary website)
          cp -r az-franny-notary-website.html "az-franny-notary-website (1).html" _site/ 2>/dev/null || true
          cp -r az-franny-notary-website.html _site/index.html 2>/dev/null || true
          # Copy ShiftWise build output
          cp -r nursesbar-shiftwise/dist/. _site/shiftwise/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
